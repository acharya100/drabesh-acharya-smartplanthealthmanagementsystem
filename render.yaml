services:
  - type: web
    name: smart-plant-backend
    runtime: python
    buildCommand: "./backend/build.sh"
    startCommand: "gunicorn backend.wsgi --log-file -"
    rootDir: "backend"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smart-plant-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"

databases:
  - name: smart-plant-db
    plan: free # Note: Render free tier PostgreSQL lasts 90 days
